<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VoyageAI — Hybrid Travel Planner
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=7.0.0"
    >

</head>


<body>


<header>

    <div class="container header">

        <div>

            <h1>
                VoyageAI
            </h1>

            <p>
                Real travel search + ranking + planning
            </p>

        </div>


        <select
            id="langSelector"
        >

            <option value="tr">
                Türkçe
            </option>

            <option value="en">
                English
            </option>

            <option value="ar">
                العربية
            </option>

        </select>

    </div>

</header>


<main class="container grid">


    <!-- FORM -->

    <section class="card">

        <form id="tripForm">

            <h2>
                Trip Search
            </h2>


            <div class="two">


                <label>

                    Departure

                    <select
                        id="origin"
                        class="input"
                        required
                    ></select>

                </label>


                <label>

                    Destination

                    <select
                        id="destination"
                        class="input"
                        required
                    ></select>

                </label>

            </div>


            <label>

                Start date

                <input
                    id="start_date"
                    type="date"
                    class="input"
                    required
                >

            </label>


            <div class="four">


                <label>

                    Adults

                    <input
                        id="adults_count"
                        type="number"
                        min="1"
                        max="15"
                        value="2"
                        class="input"
                    >

                </label>


                <label>

                    Children

                    <input
                        id="children_count"
                        type="number"
                        min="0"
                        max="8"
                        value="0"
                        class="input"
                    >

                </label>


                <label>

                    Rooms

                    <select
                        id="rooms_count"
                        class="input"
                    >

                        <option value="1">
                            1
                        </option>

                        <option value="2">
                            2
                        </option>

                        <option value="3">
                            3
                        </option>

                        <option value="4">
                            4
                        </option>

                    </select>

                </label>


                <label>

                    Nights

                    <input
                        id="nights"
                        type="number"
                        min="1"
                        max="20"
                        value="3"
                        class="input"
                    >

                </label>


            </div>


            <div
                id="childAgeWrap"
                class="hidden"
            >

                <label>

                    Child age

                    <input
                        id="child_age"
                        type="number"
                        min="1"
                        max="17"
                        value="10"
                        class="input"
                    >

                </label>

            </div>


            <label>

                Transport

                <select
                    id="transport_mode"
                    class="input"
                >

                    <option value="Bus">
                        Bus
                    </option>

                    <option value="Plane">
                        Plane
                    </option>

                    <option value="Train">
                        Train
                    </option>

                    <option value="Passenger Ferry">
                        Passenger Ferry
                    </option>

                    <option value="Car Ferry">
                        Car Ferry
                    </option>

                    <option value="Own Car">
                        Own Car
                    </option>

                    <option value="Own EV">
                        Own EV
                    </option>

                </select>

            </label>


            <label>

                Budget strategy

                <select
                    id="budget_mode"
                    class="input"
                >

                    <option value="cheapest_best">
                        Best + Cheapest
                    </option>

                    <option value="custom">
                        Custom budget
                    </option>

                </select>

            </label>


            <label>

                Budget TRY

                <input
                    id="budget_amount_try"
                    type="number"
                    min="0"
                    class="input"
                    placeholder="Optional"
                >

            </label>


            <label>

                Minimum hotel rating

                <input
                    id="hotel_min_rating"
                    type="range"
                    min="0"
                    max="10"
                    step="0.1"
                    value="8"
                    class="input"
                >

                <span id="ratingValue">
                    8
                </span>

            </label>


            <label>

                Hotel location

                <select
                    id="hotel_location"
                    class="input"
                >

                    <option value="city_center">
                        City center
                    </option>

                    <option value="near_sea">
                        Near sea
                    </option>

                    <option value="nature">
                        Nature / mountain
                    </option>

                    <option value="quiet">
                        Quiet area
                    </option>

                </select>

            </label>


            <fieldset>

                <legend>
                    Hotel amenities
                </legend>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="pool"
                        checked
                    >

                    Pool

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="spa"
                        checked
                    >

                    Spa

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="beach"
                    >

                    Beach

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="aquapark"
                    >

                    Aquapark

                </label>

            </fieldset>


            <label>

                Meal plan

                <select
                    id="meal_board"
                    class="input"
                >

                    <option value="breakfast_only">
                        Breakfast only
                    </option>

                    <option value="no_meals">
                        Room only
                    </option>

                    <option value="halfboard">
                        Half board
                    </option>

                    <option value="fullboard">
                        Full board
                    </option>

                    <option value="allinclusive">
                        All inclusive
                    </option>

                </select>

            </label>


            <label>

                Special notes

                <textarea
                    id="special_notes"
                    class="input"
                    rows="3"
                    placeholder="Family trip, local food, etc."
                ></textarea>

            </label>


            <button
                id="searchBtn"
                type="submit"
            >

                Search & Plan

            </button>


        </form>

    </section>


    <!-- RESULTS -->

    <section>


        <div
            id="emptyState"
            class="card center"
        >

            <h2>
                VoyageAI
            </h2>

            <p>
                Enter your trip requirements
                and search.
            </p>

        </div>


        <div
            id="loading"
            class="card center hidden"
        >

            <p>
                Searching hotels, restaurants,
                attractions, transport and routes...
            </p>

        </div>


        <div
            id="results"
            class="hidden"
        >


            <div class="card">

                <div class="row">

                    <div>

                        <div
                            id="routeTitle"
                            class="route"
                        >
                        </div>

                        <h2>
                            Travel Plan
                        </h2>

                        <div
                            id="dateTitle"
                            class="muted"
                        >
                        </div>

                    </div>


                    <div>

                        <div class="muted">
                            Total
                        </div>

                        <div
                            id="costTitle"
                            class="price total"
                        >
                        </div>

                    </div>

                </div>

            </div>


            <div
                id="warnings"
            ></div>


            <div
                id="hotelArea"
            ></div>


            <div
                id="transportArea"
            ></div>


            <div
                id="transferArea"
            ></div>


            <h2>
                Daily Plan
            </h2>


            <div
                id="daysArea"
            ></div>


            <div class="card">

                <h3>
                    Sources
                </h3>

                <div
                    id="sources"
                    class="links"
                ></div>

            </div>


        </div>


    </section>


</main>


<script
    src="/static/js/app.js?v=7.0.0"
></script>


</body>

</html>
