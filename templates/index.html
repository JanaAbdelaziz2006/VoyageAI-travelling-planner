<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VoyageAI — Travel Searcher</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=6.0.0"
    >

</head>


<body class="bg-slate-950 text-white min-h-screen">


<header class="border-b border-slate-800 bg-slate-900">

    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

        <div>

            <h1 class="text-2xl font-black text-sky-400">
                VoyageAI
            </h1>

            <p class="text-xs text-slate-400">
                Real travel search and ranking
            </p>

        </div>


        <select
            id="langSelector"
            class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm"
        >

            <option value="tr">
                Türkçe
            </option>

            <option value="en">
                English
            </option>

            <option value="ar">
                العربية
            </option>

        </select>

    </div>

</header>


<main class="max-w-7xl mx-auto p-4">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">


        <!-- FORM -->

        <section class="lg:col-span-4">

            <form
                id="tripForm"
                class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4"
            >

                <h2
                    class="font-bold text-lg"
                    data-i18n="title"
                >
                    VoyageAI
                </h2>


                <div class="grid grid-cols-2 gap-3">

                    <div>

                        <label
                            class="text-xs text-slate-400"
                        >
                            Departure
                        </label>

                        <select
                            id="origin"
                            required
                            class="input"
                        ></select>

                    </div>


                    <div>

                        <label
                            class="text-xs text-slate-400"
                        >
                            Destination
                        </label>

                        <select
                            id="destination"
                            required
                            class="input"
                        ></select>

                    </div>

                </div>


                <div>

                    <label class="label">
                        Start date
                    </label>

                    <input
                        id="start_date"
                        type="date"
                        required
                        class="input"
                    >

                </div>


                <div class="grid grid-cols-4 gap-2">

                    <div>

                        <label class="label">
                            Adults
                        </label>

                        <input
                            id="adults_count"
                            type="number"
                            value="2"
                            min="1"
                            max="15"
                            class="input"
                        >

                    </div>


                    <div>

                        <label class="label">
                            Children
                        </label>

                        <input
                            id="children_count"
                            type="number"
                            value="0"
                            min="0"
                            max="8"
                            class="input"
                        >

                    </div>


                    <div>

                        <label class="label">
                            Rooms
                        </label>

                        <select
                            id="rooms_count"
                            class="input"
                        >

                            <option value="1">
                                1
                            </option>

                            <option value="2">
                                2
                            </option>

                            <option value="3">
                                3
                            </option>

                            <option value="4">
                                4
                            </option>

                        </select>

                    </div>


                    <div>

                        <label class="label">
                            Nights
                        </label>

                        <input
                            id="nights"
                            type="number"
                            value="3"
                            min="1"
                            max="20"
                            class="input"
                        >

                    </div>

                </div>


                <div
                    id="childAgeWrap"
                    class="hidden"
                >

                    <label class="label">
                        Child age
                    </label>

                    <input
                        id="child_age"
                        type="number"
                        value="10"
                        min="0"
                        max="17"
                        class="input"
                    >

                </div>


                <div>

                    <label class="label">
                        Transport
                    </label>

                    <select
                        id="transport_mode"
                        class="input"
                    >

                        <option value="Bus">
                            Bus
                        </option>

                        <option value="Plane">
                            Plane
                        </option>

                        <option value="Train">
                            Train
                        </option>

                        <option value="Passenger Ferry">
                            Passenger Ferry
                        </option>

                        <option value="Car Ferry">
                            Car Ferry
                        </option>

                        <option value="Own Car">
                            Own Car
                        </option>

                        <option value="Own EV">
                            Own EV
                        </option>

                    </select>

                </div>


                <div>

                    <label class="label">
                        Budget
                    </label>

                    <select
                        id="budget_mode"
                        class="input"
                    >

                        <option value="cheapest_best">
                            Best + Cheapest
                        </option>

                        <option value="custom">
                            Custom budget
                        </option>

                    </select>

                </div>


                <div>

                    <input
                        id="budget_amount_try"
                        type="number"
                        placeholder="Budget TRY"
                        class="input"
                    >

                </div>


                <div>

                    <label class="label">
                        Minimum hotel rating
                    </label>

                    <input
                        id="hotel_min_rating"
                        type="number"
                        value="8"
                        min="0"
                        max="10"
                        step="0.1"
                        class="input"
                    >

                </div>


                <div>

                    <label class="label">
                        Hotel location
                    </label>

                    <select
                        id="hotel_location"
                        class="input"
                    >

                        <option value="city_center">
                            City center
                        </option>

                        <option value="near_sea">
                            Near sea
                        </option>

                        <option value="nature">
                            Nature / mountain
                        </option>

                        <option value="quiet">
                            Quiet area
                        </option>

                    </select>

                </div>


                <div>

                    <label class="label">
                        Hotel amenities
                    </label>

                    <div class="grid grid-cols-2 gap-2 text-sm">

                        <label>
                            <input
                                type="checkbox"
                                name="amenity"
                                value="pool"
                                checked
                            >
                            Pool
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="amenity"
                                value="spa"
                                checked
                            >
                            Spa
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="amenity"
                                value="beach"
                            >
                            Beach
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="amenity"
                                value="aquapark"
                            >
                            Aquapark
                        </label>

                    </div>

                </div>


                <div>

                    <label class="label">
                        Meal plan
                    </label>

                    <select
                        id="meal_board"
                        class="input"
                    >

                        <option value="breakfast_only">
                            Breakfast only
                        </option>

                        <option value="no_meals">
                            Room only
                        </option>

                        <option value="halfboard">
                            Half board
                        </option>

                        <option value="fullboard">
                            Full board
                        </option>

                        <option value="allinclusive">
                            All inclusive
                        </option>

                    </select>

                </div>


                <div>

                    <label class="label">
                        Special notes
                    </label>

                    <textarea
                        id="special_notes"
                        rows="3"
                        class="input"
                        placeholder="Family trip, local food, etc."
                    ></textarea>

                </div>


                <button
                    id="searchBtn"
                    type="submit"
                    class="w-full bg-gradient-to-r from-red-600 to-sky-500 rounded-xl py-3 font-bold"
                >

                    <i class="fa-solid fa-magnifying-glass mr-2"></i>

                    <span data-i18n="search">
                        Search & Plan
                    </span>

                </button>


            </form>

        </section>


        <!-- RESULTS -->

        <section class="lg:col-span-8">


            <div
                id="emptyState"
                class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center"
            >

                <div class="text-5xl text-sky-400 mb-4">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>

                <h2 class="text-xl font-bold">
                    VoyageAI
                </h2>

                <p
                    class="text-sm text-slate-400 mt-2"
                    data-i18n="noData"
                >
                    Search to see results.
                </p>

            </div>


            <div
                id="loading"
                class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center"
            >

                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-sky-400"></i>

                <p
                    class="mt-4"
                    data-i18n="searching"
                >
                    Searching...
                </p>

            </div>


            <div
                id="results"
                class="hidden space-y-5"
            >


                <section class="result-card">

                    <div class="flex justify-between">

                        <div>

                            <p
                                id="routeTitle"
                                class="text-sky-400 text-xs font-bold"
                            >
                                Bursa → İstanbul
                            </p>

                            <h2 class="text-2xl font-black">
                                Travel Plan
                            </h2>

                            <p
                                id="dateTitle"
                                class="text-xs text-slate-400 mt-1"
                            >
                                —
                            </p>

                        </div>


                        <div class="text-right">

                            <p class="text-xs text-slate-500">
                                Total
                            </p>

                            <p
                                id="costTitle"
                                class="text-2xl font-bold text-emerald-400"
                            >
                                —
                            </p>

                        </div>

                    </div>

                </section>


                <div
                    id="resultWarnings"
                    class="space-y-2"
                ></div>


                <div id="hotelArea"></div>


                <div id="transportArea"></div>


                <section>

                    <h2
                        class="text-lg font-bold mb-3"
                        data-i18n="daily"
                    >
                        Daily plan
                    </h2>

                    <div
                        id="daysArea"
                        class="space-y-4"
                    ></div>

                </section>


                <section
                    id="departureArea"
                ></section>


                <section class="result-card">

                    <h2 class="font-bold mb-3">
                        <span data-i18n="sources">
                            Sources
                        </span>
                    </h2>

                    <div
                        id="sourcesArea"
                        class="flex flex-wrap gap-2"
                    ></div>

                </section>

            </div>

        </section>

    </div>

</main>


<script
    src="/static/js/app.js?v=6.0.0"
></script>

</body>
</html>
