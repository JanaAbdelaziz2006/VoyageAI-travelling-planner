<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        VoyageAI — Hybrid Travel Planner
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css?v=7.3.0"
    >

</head>


<body>


<header>

    <div class="container header">

        <div class="brand">

            <h1>
                VoyageAI
            </h1>

            <p
                data-i18n="headerSubtitle"
            >
                Real travel search, ranking & planning
            </p>

        </div>


        <div class="header-controls">

            <select
                id="langSelector"
                aria-label="Language"
            >

                <option
                    value="tr"
                    data-i18n="languageTurkish"
                >
                    Türkçe
                </option>

                <option
                    value="en"
                    data-i18n="languageEnglish"
                >
                    English
                </option>

                <option
                    value="ar"
                    data-i18n="languageArabic"
                >
                    العربية
                </option>

            </select>


            <select
                id="themeSelector"
                aria-label="Color theme"
            >

                <option
                    value="midnight"
                    data-i18n="themeMidnight"
                >
                    Midnight
                </option>

                <option
                    value="ocean"
                    data-i18n="themeOcean"
                >
                    Ocean
                </option>

                <option
                    value="lavender"
                    data-i18n="themeLavender"
                >
                    Lavender
                </option>

                <option
                    value="sunset"
                    data-i18n="themeSunset"
                >
                    Sunset
                </option>

            </select>


            <button
                id="modeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Switch between dark and bright mode"
                aria-pressed="false"
            >

                <span
                    class="theme-toggle-track"
                    aria-hidden="true"
                ></span>

                <span
                    id="modeToggleIcon"
                    class="theme-toggle-icon"
                    aria-hidden="true"
                >
                    ☾
                </span>

                <span id="modeToggleText">
                    Dark
                </span>

            </button>

        </div>

    </div>

</header>


<main class="container grid">


    <!-- FORM -->

    <section class="card">

        <form id="tripForm">

            <h2
                data-i18n="tripSearch"
            >
                Trip Search
            </h2>


            <div class="two">


                <label>

                    <span
                        data-i18n="departure"
                    >
                        Departure
                    </span>

                    <select
                        id="origin"
                        class="input"
                        required
                    ></select>

                </label>


                <label>

                    <span
                        data-i18n="destination"
                    >
                        Destination
                    </span>

                    <select
                        id="destination"
                        class="input"
                        required
                    ></select>

                </label>

            </div>


            <label>

                <span
                    data-i18n="startDate"
                >
                    Start date
                </span>

                <input
                    id="start_date"
                    type="date"
                    class="input"
                    required
                >

            </label>


            <div class="four">


                <label>

                    <span
                        data-i18n="adults"
                    >
                        Adults
                    </span>

                    <input
                        id="adults_count"
                        type="number"
                        min="1"
                        max="15"
                        value="2"
                        class="input"
                    >

                </label>


                <label>

                    <span
                        data-i18n="children"
                    >
                        Children
                    </span>

                    <input
                        id="children_count"
                        type="number"
                        min="0"
                        max="8"
                        value="0"
                        class="input"
                    >

                </label>


                <label>

                    <span
                        data-i18n="rooms"
                    >
                        Rooms
                    </span>

                    <select
                        id="rooms_count"
                        class="input"
                    >

                        <option value="1">
                            1
                        </option>

                        <option value="2">
                            2
                        </option>

                        <option value="3">
                            3
                        </option>

                        <option value="4">
                            4
                        </option>

                    </select>

                </label>


                <label>

                    <span
                        data-i18n="nights"
                    >
                        Nights
                    </span>

                    <input
                        id="nights"
                        type="number"
                        min="1"
                        max="20"
                        value="3"
                        class="input"
                    >

                </label>


            </div>


            <div
                id="childAgeWrap"
                class="hidden"
            >
            </div>


            <label>

                <span
                    data-i18n="transport"
                >
                    Transport
                </span>

                <select
                    id="transport_mode"
                    class="input"
                >

                    <option
                        value="Bus"
                        data-i18n="bus"
                    >
                        Bus
                    </option>

                    <option
                        value="Plane"
                        data-i18n="plane"
                    >
                        Plane
                    </option>

                    <option
                        value="Train"
                        data-i18n="train"
                    >
                        Train
                    </option>

                    <option
                        value="Passenger Ferry"
                        data-i18n="passengerFerry"
                    >
                        Passenger Ferry
                    </option>

                    <option
                        value="Car Ferry"
                        data-i18n="carFerry"
                    >
                        Car Ferry
                    </option>

                    <option
                        value="Own Car"
                        data-i18n="ownCar"
                    >
                        Own Car
                    </option>

                    <option
                        value="Own EV"
                        data-i18n="ownEV"
                    >
                        Own EV
                    </option>

                </select>

            </label>


            <label>

                <span
                    data-i18n="budgetStrategy"
                >
                    Budget strategy
                </span>

                <select
                    id="budget_mode"
                    class="input"
                >

                    <option
                        value="cheapest_best"
                        data-i18n="bestCheapest"
                    >
                        Best + Cheapest
                    </option>

                    <option
                        value="custom"
                        data-i18n="customBudget"
                    >
                        Custom budget
                    </option>

                </select>

            </label>


            <label>

                <span
                    data-i18n="budgetTRY"
                >
                    Budget TRY
                </span>

                <input
                    id="budget_amount_try"
                    type="number"
                    min="0"
                    class="input"
                    data-i18n-placeholder="optional"
                    placeholder="Optional"
                >

            </label>


            <label>

                <span
                    data-i18n="minimumHotelRating"
                >
                    Minimum hotel rating
                </span>

                <input
                    id="hotel_min_rating"
                    type="range"
                    min="0"
                    max="10"
                    step="0.1"
                    value="8"
                    class="input"
                >

                <span id="ratingValue">
                    8
                </span>

            </label>


            <label>

                <span
                    data-i18n="hotelLocation"
                >
                    Hotel location
                </span>

                <select
                    id="hotel_location"
                    class="input"
                >

                    <option
                        value="city_center"
                        data-i18n="cityCenter"
                    >
                        City center
                    </option>

                    <option
                        value="near_sea"
                        data-i18n="nearSea"
                    >
                        Near sea
                    </option>

                    <option
                        value="nature"
                        data-i18n="natureMountain"
                    >
                        Nature / mountain
                    </option>

                    <option
                        value="quiet"
                        data-i18n="quietArea"
                    >
                        Quiet area
                    </option>

                </select>

            </label>


            <fieldset>

                <legend
                    data-i18n="hotelAmenities"
                >
                    Hotel amenities
                </legend>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="pool"
                        checked
                    >

                    <span
                        data-i18n="pool"
                    >
                        Pool
                    </span>

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="spa"
                        checked
                    >

                    <span
                        data-i18n="spa"
                    >
                        Spa
                    </span>

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="beach"
                    >

                    <span
                        data-i18n="beach"
                    >
                        Beach
                    </span>

                </label>


                <label>

                    <input
                        type="checkbox"
                        name="amenity"
                        value="aquapark"
                    >

                    <span
                        data-i18n="aquapark"
                    >
                        Aquapark
                    </span>

                </label>

            </fieldset>


            <label>

                <span
                    data-i18n="mealPlan"
                >
                    Meal plan
                </span>

                <select
                    id="meal_board"
                    class="input"
                >

                    <option
                        value="breakfast_only"
                        data-i18n="breakfastOnly"
                    >
                        Breakfast only
                    </option>

                    <option
                        value="no_meals"
                        data-i18n="roomOnly"
                    >
                        Room only
                    </option>

                    <option
                        value="halfboard"
                        data-i18n="halfBoard"
                    >
                        Half board
                    </option>

                    <option
                        value="fullboard"
                        data-i18n="fullBoard"
                    >
                        Full board
                    </option>

                    <option
                        value="allinclusive"
                        data-i18n="allInclusive"
                    >
                        All inclusive
                    </option>

                </select>

            </label>


            <label>

                <span
                    data-i18n="specialNotes"
                >
                    Special notes
                </span>

                <textarea
                    id="special_notes"
                    class="input"
                    rows="3"
                    data-i18n-placeholder="specialNotesPlaceholder"
                    placeholder="Family trip, local food, etc."
                ></textarea>

            </label>


            <button
                id="searchBtn"
                type="submit"
                data-i18n="search"
            >
                Search & Plan
            </button>


        </form>

    </section>


    <!-- RESULTS -->

    <section>


        <div
            id="emptyState"
            class="card center"
        >

            <h2>
                VoyageAI
            </h2>

            <p
                data-i18n="emptyState"
            >
                Enter your trip requirements and search.
            </p>

        </div>


        <div
            id="loading"
            class="card center hidden"
        >

            <p
                data-i18n="loading"
            >
                Searching hotels, restaurants,
                attractions, transport and routes...
            </p>

        </div>


        <div
            id="results"
            class="hidden"
        >


            <div class="card">

                <div class="row">

                    <div>

                        <div
                            id="routeTitle"
                            class="route"
                        >
                        </div>

                        <h2
                            data-i18n="travelPlan"
                        >
                            Travel Plan
                        </h2>

                        <div
                            id="dateTitle"
                            class="muted"
                        >
                        </div>

                    </div>


                    <div>

                        <div
                            class="muted"
                            data-i18n="total"
                        >
                            Total
                        </div>

                        <div
                            id="costTitle"
                            class="price total"
                        >
                        </div>

                    </div>

                </div>

            </div>


            <div
                id="warnings"
            ></div>


            <div
                id="hotelArea"
            ></div>


            <div
                id="transportArea"
            ></div>


            <div
                id="transferArea"
            ></div>


            <h2
                data-i18n="dailyPlan"
            >
                Daily Plan
            </h2>


            <div
                id="daysArea"
            ></div>


            <div class="card">

                <h3
                    data-i18n="sources"
                >
                    Sources
                </h3>

                <div
                    id="sources"
                    class="links"
                ></div>

            </div>


        </div>


    </section>


</main>


<script
    src="/static/js/app.js?v=7.3.0"
></script>


</body>

</html>
